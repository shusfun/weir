name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Public tag to build (select the same tag as workflow ref)
        required: true
        type: string
      dry_run:
        description: Build without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  WEIR_OPERATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    if: github.repository == 'shusfun/weir'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "refs/tags/$RELEASE_TAG"
          python3 deploy/release_public.py check --tag "$RELEASE_TAG"
          echo "version=$(python3 deploy/version.py check VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Verify committed console assets
        run: |
          git diff --exit-code -- apps/weir/static
          test -z "$(git ls-files --others --exclude-standard apps/weir/static)"
      - name: Check Go workspace modules
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test -timeout=40m ./...
          for module in packages/dsh packages/laya; do
            if [ -f "$module/go.mod" ]; then
              (cd "$module" && go build ./... && go vet ./... && go test ./...)
            fi
          done
      - name: Check deployment scripts
        run: |
          set -euo pipefail
          sh -n deploy/install.sh
          bash -n deploy/install-online.sh
          python3 -m unittest discover -s deploy -p '*_test.py'
      - name: Package linux/amd64 and linux/arm64
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLIC_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          flags="-s -w -X github.com/shusfun/weir/internal/buildinfo.Version=${VERSION} -X github.com/shusfun/weir/internal/buildinfo.Revision=${PUBLIC_COMMIT}"
          for arch in amd64 arm64; do
            release="dist/weir-${VERSION}-linux-${arch}"
            mkdir -p "$release"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "$flags" -o "$release/weir" ./apps/weir
            cp deploy/install.sh deploy/sources.json deploy/version.py VERSION "$release/"
          done
          python3 deploy/package_release.py "$VERSION" amd64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: weir-linux
          path: |
            dist/weir-*-linux-*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: weir-linux
          path: dist
      - name: Publish verified public assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PUBLIC_COMMIT: ${{ needs.build.outputs.commit }}
        run: python3 deploy/release_public.py publish --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$PUBLIC_COMMIT"
