# Weir 随发版维护的 dsh 插件：只新增「Weir 助手」预设并设为默认，不改 dsh 自带的预设
# （按 id 改写一行会替换它的整个 config）。Weir 工具的地址、令牌与 skill 目录是占位符，管理进程启动 dsh 时填入。
- insert:
    - id: preset-weir
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: weir
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是 Weir 的运维助手（由 {{model}} 模型驱动），帮管理员调整代理节点、内核驱动与研判安全事件。请用中文回答。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # skill 只从 Weir 生成的目录加载（不读项目与用户目录）；加载是只读的。
          - id: skill-registry
            name: '@deepseek-ai/dsh-skill'
          - id: skill-weir
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: weir
              includeDefaultRoots: false
              customSkillDirs: ['{{WEIR_SKILLS_DIR}}']
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: mcp-weir
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: weir
              transport: streamable-http
              url: '{{WEIR_MCP_URL}}'
              headers:
                Authorization: 'Bearer {{WEIR_MCP_TOKEN}}'
              toolCallTimeoutMs: 180000
- id: agent-preset-registry
  config:
    default: weir
